[en]
tajuk = "Awesome Payload CMS"
pembuka = "Open-source plugins, templates and apps for [Payload](https://payloadcms.com), the open-source Next.js framework and headless CMS. Ranked by stars and recent activity, refreshed every week."

[ms]
tajuk = "Senarai Berpangkat Payload CMS"
pembuka = "Plugin, templat dan aplikasi sumber terbuka untuk [Payload](https://payloadcms.com), rangka kerja Next.js dan CMS headless sumber terbuka. Dipangkat ikut bintang dan aktiviti terkini, dikemas setiap minggu."

[github]
# Deskripsi + topik repo (D38): deskripsi lulus config/gaya.toml; topik = `gilap topik --wajib awesome,awesome-list` 25 Okt
# (data GitHub; taksa dibuang). Teks awam — terbit bait-sama selepas kelulusan pemilik.
penerangan = "Ranked, weekly-updated list of open-source plugins, templates and apps for Payload CMS."
topik = ["awesome", "awesome-list", "cms", "nextjs", "headless-cms", "payloadcms", "payload-plugin", "payload-cms"]

[pangkat]
bintang = 1.0
aktif = 1.0

[ambang]
bintang_min = 10
hari_tidak_aktif = 365

[cari]
had = 100
pertanyaan = [
  "topic:payload-plugin",
  "topic:payloadcms",
  "topic:payload-cms",
  "topic:payloadcms-plugin",
  '"payload cms" plugin',
  '"payloadcms" plugin',
  '"payload cms" template',
  '"payload cms" starter',
  '"payload 3"',
  '"payload cms" translation',
  '"payload cms" localization',
  '"payload cms" i18n',
]

