# Senarai Payload CMS (PELAN-senarai-niche S5, D32). Teks EN/BM di sini = teks awam: DRAF sehingga flag S6 dijawab `ok`.
# Kurasi: entri = repo KHUSUS Payload CMS (plugin, templat, aplikasi yang dibina atasnya); repo lapuk tetap entri —
# pangkat membuangnya (> hari_tidak_aktif) dan ia kembali sendiri bila aktif semula. `kecuali` = bukan Payload CMS
# ("payload" keselamatan/dron/Android), contoh tutorial, senarai awesome lain, portfolio peribadi, penerangan bukan Latin.
